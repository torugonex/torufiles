<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライフゲーム</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #677084;
    --border: #d9dde5;
    --grid: #e8ebf0;
    --cell: #2f7d5b;
    --accent: #2f7d5b;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --panel: #1b1f27;
      --text: #e6e9ef;
      --muted: #97a0b3;
      --border: #2e3440;
      --grid: #232833;
      --cell: #5fd39a;
      --accent: #5fd39a;
      --accent-text: #0d1a13;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 16px; font-size: 0.9rem; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  button, select {
    font: inherit;
    font-size: 0.9rem;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--muted); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    min-width: 5.5em;
  }
  label.speed {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .stats {
    display: flex;
    gap: 16px;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .stats b { color: var(--text); }
  .board {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  details { margin-top: 16px; font-size: 0.9rem; }
  summary { cursor: pointer; }
  details ul { color: var(--muted); padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>ライフゲーム</h1>
  <p class="lead">セルをクリック（ドラッグ）して生死を切り替え、「開始」で世代を進めます。</p>

  <div class="controls">
    <button id="play" class="primary">開始</button>
    <button id="step">1世代進める</button>
    <button id="random">ランダム</button>
    <button id="clear">クリア</button>
    <select id="pattern" aria-label="パターンを配置">
      <option value="">パターンを配置…</option>
      <option value="glider">グライダー</option>
      <option value="lwss">軽量級宇宙船</option>
      <option value="pulsar">パルサー</option>
      <option value="gun">グライダー銃</option>
      <option value="rpentomino">R-ペントミノ</option>
      <option value="acorn">ドングリ</option>
    </select>
    <label class="speed">速度
      <input id="speed" type="range" min="1" max="60" value="15">
    </label>
  </div>

  <div class="stats">
    <span>世代: <b id="gen">0</b></span>
    <span>個体数: <b id="pop">0</b></span>
  </div>

  <div class="board"><canvas id="canvas"></canvas></div>

  <details>
    <summary>ルール</summary>
    <ul>
      <li>誕生：死んでいるセルの周囲にちょうど3つの生きたセルがあれば、次の世代で生まれる。</li>
      <li>生存：生きているセルの周囲に2つか3つの生きたセルがあれば、次の世代でも生き残る。</li>
      <li>過疎・過密：それ以外の場合、生きているセルは次の世代で死ぬ。</li>
      <li>盤面の端は反対側とつながっています（トーラス）。</li>
    </ul>
  </details>
</main>

<script>
(() => {
  const COLS = 80;
  const ROWS = 50;

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const playBtn = document.getElementById('play');
  const genEl = document.getElementById('gen');
  const popEl = document.getElementById('pop');
  const speedInput = document.getElementById('speed');
  const patternSelect = document.getElementById('pattern');

  let grid = new Uint8Array(COLS * ROWS);
  let next = new Uint8Array(COLS * ROWS);
  let generation = 0;
  let running = false;
  let lastTick = 0;
  let cellSize = 10;

  // パターン定義：'O' が生きたセル
  const PATTERNS = {
    glider: [
      '.O.',
      '..O',
      'OOO',
    ],
    lwss: [
      '.O..O',
      'O....',
      'O...O',
      'OOOO.',
    ],
    pulsar: [
      '..OOO...OOO..',
      '.............',
      'O....O.O....O',
      'O....O.O....O',
      'O....O.O....O',
      '..OOO...OOO..',
      '.............',
      '..OOO...OOO..',
      'O....O.O....O',
      'O....O.O....O',
      'O....O.O....O',
      '.............',
      '..OOO...OOO..',
    ],
    gun: [
      '........................O...........',
      '......................O.O...........',
      '............OO......OO............OO',
      '...........O...O....OO............OO',
      'OO........O.....O...OO..............',
      'OO........O...O.OO....O.O...........',
      '..........O.....O.......O...........',
      '...........O...O....................',
      '............OO......................',
    ],
    rpentomino: [
      '.OO',
      'OO.',
      '.O.',
    ],
    acorn: [
      '.O.....',
      '...O...',
      'OO..OOO',
    ],
  };

  const idx = (x, y) => y * COLS + x;

  function colors() {
    const s = getComputedStyle(document.documentElement);
    return {
      bg: s.getPropertyValue('--panel').trim(),
      grid: s.getPropertyValue('--grid').trim(),
      cell: s.getPropertyValue('--cell').trim(),
    };
  }
  let palette = colors();

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const width = canvas.parentElement.clientWidth;
    cellSize = width / COLS;
    const height = cellSize * ROWS;
    canvas.style.height = height + 'px';
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const w = cellSize * COLS;
    const h = cellSize * ROWS;
    ctx.fillStyle = palette.bg;
    ctx.fillRect(0, 0, w, h);

    // 格子線（セルが小さすぎるときは省略）
    if (cellSize >= 5) {
      ctx.strokeStyle = palette.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 1; x < COLS; x++) {
        const px = Math.round(x * cellSize) + 0.5;
        ctx.moveTo(px, 0);
        ctx.lineTo(px, h);
      }
      for (let y = 1; y < ROWS; y++) {
        const py = Math.round(y * cellSize) + 0.5;
        ctx.moveTo(0, py);
        ctx.lineTo(w, py);
      }
      ctx.stroke();
    }

    ctx.fillStyle = palette.cell;
    const pad = cellSize >= 5 ? 1 : 0;
    let population = 0;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[idx(x, y)]) {
          population++;
          ctx.fillRect(x * cellSize + pad, y * cellSize + pad, cellSize - pad, cellSize - pad);
        }
      }
    }
    genEl.textContent = generation;
    popEl.textContent = population;
  }

  function step() {
    for (let y = 0; y < ROWS; y++) {
      const up = (y - 1 + ROWS) % ROWS;
      const down = (y + 1) % ROWS;
      for (let x = 0; x < COLS; x++) {
        const left = (x - 1 + COLS) % COLS;
        const right = (x + 1) % COLS;
        const n =
          grid[idx(left, up)] + grid[idx(x, up)] + grid[idx(right, up)] +
          grid[idx(left, y)] +                     grid[idx(right, y)] +
          grid[idx(left, down)] + grid[idx(x, down)] + grid[idx(right, down)];
        const alive = grid[idx(x, y)];
        next[idx(x, y)] = (n === 3 || (alive && n === 2)) ? 1 : 0;
      }
    }
    [grid, next] = [next, grid];
    generation++;
  }

  function loop(time) {
    if (!running) return;
    const interval = 1000 / Number(speedInput.value);
    if (time - lastTick >= interval) {
      lastTick = time;
      step();
      draw();
    }
    requestAnimationFrame(loop);
  }

  function setRunning(value) {
    running = value;
    playBtn.textContent = running ? '停止' : '開始';
    if (running) {
      lastTick = 0;
      requestAnimationFrame(loop);
    }
  }

  function clearGrid() {
    grid.fill(0);
    generation = 0;
  }

  function randomize() {
    for (let i = 0; i < grid.length; i++) {
      grid[i] = Math.random() < 0.25 ? 1 : 0;
    }
    generation = 0;
  }

  function placePattern(name) {
    const rows = PATTERNS[name];
    if (!rows) return;
    clearGrid();
    const ox = Math.floor((COLS - rows[0].length) / 2);
    const oy = Math.floor((ROWS - rows.length) / 2);
    rows.forEach((row, dy) => {
      [...row].forEach((ch, dx) => {
        if (ch === 'O') grid[idx(ox + dx, oy + dy)] = 1;
      });
    });
  }

  // マウス・タッチでセルを描く
  let drawing = false;
  let paintValue = 1;

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / cellSize);
    const y = Math.floor((e.clientY - rect.top) / cellSize);
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return null;
    return { x, y };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const c = cellFromEvent(e);
    if (!c) return;
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    paintValue = grid[idx(c.x, c.y)] ? 0 : 1;
    grid[idx(c.x, c.y)] = paintValue;
    draw();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const c = cellFromEvent(e);
    if (!c) return;
    grid[idx(c.x, c.y)] = paintValue;
    draw();
  });
  const stopDrawing = () => { drawing = false; };
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);

  playBtn.addEventListener('click', () => setRunning(!running));
  document.getElementById('step').addEventListener('click', () => {
    setRunning(false);
    step();
    draw();
  });
  document.getElementById('random').addEventListener('click', () => {
    randomize();
    draw();
  });
  document.getElementById('clear').addEventListener('click', () => {
    setRunning(false);
    clearGrid();
    draw();
  });
  patternSelect.addEventListener('change', () => {
    placePattern(patternSelect.value);
    patternSelect.value = '';
    draw();
  });

  // スペースキーで開始／停止
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      setRunning(!running);
    }
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    palette = colors();
    draw();
  });
  window.addEventListener('resize', resize);

  placePattern('gun');
  resize();
})();
</script>
</body>
</html>
